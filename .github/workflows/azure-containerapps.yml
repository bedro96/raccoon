name: Build and deploy to Azure Container Apps

# NOTE: Azure resources for this project were torn down (resource group rg-ponpoko-eval and the
# ponpoko-github-oidc app registration deleted) after the evaluation concluded. This workflow's
# trigger has been switched from automatic (push to main) to manual-only so a future commit does
# not silently re-provision billable Azure infrastructure. To redeploy: recreate the app
# registration + federated credential + role assignments (see docs/deployment/azure-oidc-setup.md)
# and the GitHub repository variables, then run this workflow manually.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  # azd does not inherit the azure/login OIDC session automatically — it needs these
  # exposed as plain env vars to auto-detect and use GitHub's federated OIDC token.
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: azd login (OIDC)
        shell: bash
        run: |
          set -euo pipefail
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Initialize azd environment
        shell: bash
        run: |
          set -euo pipefail
          if azd env select "$AZURE_ENV_NAME" >/dev/null 2>&1; then
            echo "Using existing azd environment $AZURE_ENV_NAME"
          else
            azd env new "$AZURE_ENV_NAME" --no-prompt
          fi
          azd env set AZURE_LOCATION "$AZURE_LOCATION"

          eval "$(azd env get-values)"
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ]; then
            azd provision --no-prompt
            eval "$(azd env get-values)"
          fi
          echo "AZURE_RESOURCE_GROUP=$AZURE_RESOURCE_GROUP" >> "$GITHUB_ENV"

      - name: Build and push image to ACR
        shell: bash
        run: |
          set -euo pipefail
          ACR_NAME=$(az resource list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.ContainerRegistry/registries \
            --query '[0].name' -o tsv)
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query loginServer -o tsv)
          IMAGE_TAG="$ACR_LOGIN_SERVER/ponpoko:${GITHUB_SHA}"

          az acr login --name "$ACR_NAME"
          docker build --file Dockerfile --tag "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

          azd env set containerImage "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Provision infrastructure and deploy image
        shell: bash
        run: |
          set -euo pipefail
          azd provision --no-prompt
