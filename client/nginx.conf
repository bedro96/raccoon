server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container Apps' health probe just needs a 200 somewhere; the SPA's own
    # index page also works fine, but this small dedicated fast-path avoids
    # any front-end error state affecting the health check.
    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Level (.map) files are raw binary parsed by the client's own loader --
    # serve them as opaque bytes rather than letting nginx guess a text type.
    location ~* \.map$ {
        default_type application/octet-stream;
        try_files $uri =404;
    }
}
